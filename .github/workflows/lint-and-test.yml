name: Syntax and Lint Check (AOA Minimal CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install basic tools (no GPU deps)
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Lint with flake8
        run: |
          echo "Running flake8 lint..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,venv,env,agents/ocr/tests
          echo "flake8 completed."

      - name: Check code formatting with black
        run: |
          echo "Checking formatting..."
          black --check --diff --exclude='/(\.git|__pycache__|venv|env|agents/ocr/tests)/' .
          echo "Black format check complete."
        continue-on-error: true

      - name: Syntax check (no pytest)
        run: |
          echo "Running syntax checks..."
          python -m compileall agents backend || true
          echo "Syntax compilation complete."

      - name: Skip integration and GPU tests
        run: |
          echo "✅ Skipping GPU / integration tests (handled manually on DGX Spark)."
          echo "This workflow verifies syntax and linting only."
